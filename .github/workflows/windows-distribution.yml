name: Windows distribution
on:
  push:
    branches: [master, feature/postman-setup]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish and test Windows x64 package
        id: build
        shell: pwsh
        run: ./scripts/Build-WindowsDistribution.ps1
      - name: Test setup script without changing runner marketplaces
        shell: pwsh
        run: ./scripts/Test-DistributionSetup.ps1 -PackageDirectory '${{ steps.build.outputs.package_dir }}'
      - uses: actions/upload-artifact@v4
        with:
          name: SqlServerDevLens-win-x64
          path: |
            ${{ steps.build.outputs.package_dir }}/*.zip
            ${{ steps.build.outputs.package_dir }}/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.package_dir }}/*.zip
            ${{ steps.build.outputs.package_dir }}/SHA256SUMS.txt
