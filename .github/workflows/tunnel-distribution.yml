name: Tunnel Windows distribution
on:
  push:
    branches: [Tunnel_Installation]
    tags: ['tunnel-*']
  pull_request:
    branches: [Tunnel_Installation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      artifact: DevLens-Tunnel-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SqlServerDevLens.slnx -c Release
      - run: dotnet test SqlServerDevLens.slnx -c Release --no-build
      - name: Build isolated tunnel package
        id: build
        shell: pwsh
        run: ./scripts/Build-TunnelDistribution.ps1
      - name: Verify fresh extraction with spaces
        shell: pwsh
        run: ./scripts/Test-TunnelDistribution.ps1 -PackageDirectory '${{ steps.build.outputs.package_dir }}'
      - uses: actions/upload-artifact@v4
        with:
          name: DevLens-Tunnel-${{ github.run_id }}
          path: |
            ${{ steps.build.outputs.package_dir }}/*.zip
            ${{ steps.build.outputs.package_dir }}/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/tunnel-')
    needs: package
    runs-on: ubuntu-latest
    environment: tunnel-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: package
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            package/*.zip
            package/SHA256SUMS.txt
