name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SqlServerDevLens.slnx
      - run: dotnet build SqlServerDevLens.slnx -c Release --no-restore
      - run: dotnet test SqlServerDevLens.slnx -c Release --no-build
      - run: ./scripts/Test-Mcp.ps1
        shell: pwsh
