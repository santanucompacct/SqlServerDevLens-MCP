name: Build Avalonia (.NET 10)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SqlServerDevLens.slnx

      - name: Build
        run: dotnet build SqlServerDevLens.slnx --configuration Release --no-restore
