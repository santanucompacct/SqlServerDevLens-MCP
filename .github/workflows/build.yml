name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  postman-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global postman-cli@1.73.0
      - name: Verify client against local synthetic Postman control API
        shell: bash
        run: |
          postman simulation run postman/simulations/setup.sim.yaml --port 4917 --output ndjson --no-history > "$RUNNER_TEMP/postman-sim.ndjson" 2> "$RUNNER_TEMP/postman-sim.err" &
          trap 'pkill -INT -f "simulation run postman/simulations/setup.sim.yaml" || true' EXIT
          for attempt in $(seq 1 40); do
            if grep -q '"event":"listening"' "$RUNNER_TEMP/postman-sim.ndjson"; then break; fi
            sleep 1
          done
          grep -q '"event":"listening"' "$RUNNER_TEMP/postman-sim.ndjson"
          export DEVLENS_POSTMAN_SIMULATION_URL=http://127.0.0.1:4917/postman/
          dotnet test SqlServerDevLens.slnx -c Release --filter FullyQualifiedName~RealHttpClientAgainstPostmanSimulation
          grep -q '"event":"request"' "$RUNNER_TEMP/postman-sim.ndjson"
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore SqlServerDevLens.slnx
      - run: dotnet build SqlServerDevLens.slnx -c Release --no-restore
      - run: dotnet test SqlServerDevLens.slnx -c Release --no-build
      - run: ./scripts/Test-Mcp.ps1
        shell: pwsh
  procedure-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start disposable localhost SQL Server
        shell: bash
        run: |
          CI_SQL_PASSWORD="Dvl-$(openssl rand -hex 24)-1!"
          echo "::add-mask::$CI_SQL_PASSWORD"
          docker run -d --name devlens-test-sql -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$CI_SQL_PASSWORD" mcr.microsoft.com/mssql/server:2022-latest
          echo "DEVLENS_PROCEDURE_TEST_CONNECTION_STRING=Server=127.0.0.1,1433;User ID=sa;Password=$CI_SQL_PASSWORD;Encrypt=True;TrustServerCertificate=True;Connect Timeout=3" >> "$GITHUB_ENV"
          echo "DEVLENS_PROCEDURE_TEST_ALLOW_DATABASE_CREATE=1" >> "$GITHUB_ENV"
      - run: dotnet build SqlServerDevLens.slnx -c Release
      - run: dotnet test SqlServerDevLens.slnx -c Release --no-build --filter FullyQualifiedName~DisposableProcedureIntegrationTests
      - name: Stop disposable SQL Server
        if: always()
        run: docker rm -f devlens-test-sql
